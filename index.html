<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website profil M.Nabil Rahmadhan - Pelatihan TIK. Siswa SMK yang tertarik dengan teknologi dan desain.">
    <title>Profil Saya</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Terpisah -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="profile-wrapper">
        <div class="profile-card">
            <!-- Foto Profil Bulat (Dapat diklik untuk melihat) -->
            <div class="avatar-container" id="avatar-container" title="Klik untuk melihat foto profil" role="button" tabindex="0">
                <img src="nabil.jpg" alt="Foto Profil M.Nabil Rahmadhan" class="profile-image" id="profile-img">
                <div class="avatar-overlay">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        <line x1="11" y1="8" x2="11" y2="14"></line>
                        <line x1="8" y1="11" x2="14" y2="11"></line>
                    </svg>
                </div>
            </div>

            <!-- Nama Lengkap -->
            <h1 class="profile-name">M.Nabil Rahmadhan</h1>

            <!-- Bio / Deskripsi -->
            <p class="profile-bio">
                Siswa SMK yang tertarik dengan teknologi dan desain. Selamat datang di website pertama saya!
            </p>

            <!-- Tautan Instagram -->
            <a href="https://www.instagram.com/nbiletuzawa?obrf=MTMwanY4Z3ZsdTEzNA==" target="_blank" rel="noopener noreferrer" class="profile-link" id="instagram-link">
                Kunjungi Instagram Saya
            </a>

            <!-- Kotak Sapa Saya -->
            <div class="greet-box-container">
                <button type="button" class="btn-greet" id="btn-greet">
                    <span>Sapa Saya</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Popup untuk Melihat Foto Profil Penuh -->
    <div class="modal-overlay" id="image-modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-card">
            <button class="modal-close" id="modal-close" aria-label="Tutup tampilan foto">&times;</button>
            <div class="modal-image-wrapper">
                <img src="nabil.jpg" alt="Foto Profil M.Nabil Rahmadhan - Tampilan Penuh" class="modal-image">
            </div>
            <div class="modal-footer">
                <p class="modal-caption">M.Nabil Rahmadhan</p>
                <span class="modal-sub">Foto Profil</span>
            </div>
        </div>
    </div>

    <!-- JS Terpisah -->
    <script src="script.js"></script>
</body>
</html>
